[project]
name = "pyvideotools"
version = "0.2.1"
description = "Video metric and encoding tools"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "setuptools>=84.0.0",
    "vsjetpack[source]>=2.2.4",
]
authors = [
  { name="Noam Hache", email="noam.hache@gmail.com" },
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/Noam-Hache/pyvideotools"
Issues = "https://github.com/Noam-Hache/pyvideotools/issues"
